<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KotaiLabs - Preço ao Vivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --deep-bg: #020b14;
            --panel-bg: rgba(6, 22, 40, 0.94);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--deep-bg);
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Rajdhani', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container { 
            width: 100%; 
            max-width: 460px;
            padding: 20px; 
        }

        .price-card {
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue);
            font-size: 2.6rem;
            margin-bottom: 8px;
            text-shadow: 0 0 15px var(--neon-blue);
        }

        .subtitle { 
            color: #a0c4ff; 
            font-size: 1.2rem; 
            margin-bottom: 32px; 
        }

        #livePrice {
            font-size: 3rem;
            font-weight: bold;
            color: var(--neon-blue);
            text-shadow: 0 0 20px var(--neon-blue);
            margin: 20px 0;
            letter-spacing: 3px;
        }

        #priceChange {
            font-size: 1.3rem;
            margin-bottom: 25px;
        }

        #lastUpdate {
            font-size: 0.9rem;
            color: #00ff9d;
            margin-top: 10px;
        }

        .footer-info { 
            margin-top: 35px; 
            border-top: 1px solid rgba(0, 243, 255, 0.2); 
            padding-top: 16px; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="price-card">
        <h1>KotaiLabs</h1>
        <p class="subtitle">Preço ao Vivo - KOTAI (KTI)</p>

        <div id="livePrice">$ 0.00000000</div>
        <div id="priceChange" style="color: #00ff9d;">Carregando...</div>
        <div id="lastUpdate"></div>

        <div class="footer-info">
            <p id="statusMsg" style="font-size: 0.95rem; color: #00ff9d;">Atualizado em tempo real</p>
            <div style="font-size: 0.8rem; color: #555; margin-top: 8px;">Fonte: GeckoTerminal • PancakeSwap V3 (BSC)</div>
        </div>
    </div>
</div>

<script>
    const POOL_ADDRESS = "0x62fc0a64b7d80cdb34c82b80ea985e3ceceb9373";
    
    let lastValidPrice = null;
    let lastValidChange5m = 0;
    let lastValidChange1h = 0;
    let lastUpdateTime = null;

    async function loadLivePrice() {
        try {
            const res = await fetch(`https://api.geckoterminal.com/api/v2/networks/bsc/pools/${POOL_ADDRESS}`);
            if (!res.ok) throw new Error("Falha na rede");

            const json = await res.json();
            const attributes = json.data?.attributes;
            if (!attributes) throw new Error("Dados inválidos");

            const price = parseFloat(attributes.base_token_price_usd);
            if (isNaN(price) || price <= 0) throw new Error("Preço inválido");

            const change5m = parseFloat(attributes.price_change_percentage?.m5 || 0);
            const change1h = parseFloat(attributes.price_change_percentage?.h1 || 0);

            lastValidPrice = price;
            lastValidChange5m = change5m;
            lastValidChange1h = change1h;
            lastUpdateTime = new Date();

            document.getElementById('livePrice').textContent = '$ ' + price.toFixed(8);
            
            const changeEl = document.getElementById('priceChange');
            changeEl.innerHTML = `5m: ${change5m >= 0 ? '↑' : '↓'} ${change5m.toFixed(1)}% | 1h: ${change1h >= 0 ? '↑' : '↓'} ${change1h.toFixed(1)}%`;
            changeEl.style.color = change5m >= 0 ? '#00ff9d' : '#ff4d4d';

            document.getElementById('statusMsg').innerText = "Atualizado em tempo real";
            document.getElementById('statusMsg').style.color = "#00ff9d";

            const timeStr = lastUpdateTime.toLocaleTimeString('pt-BR');
            document.getElementById('lastUpdate').innerText = `Última atualização: ${timeStr}`;

        } catch (e) {
            console.error(e);
            if (lastValidPrice !== null) {
                document.getElementById('statusMsg').innerText = "Aguardando nova cotação...";
                document.getElementById('statusMsg').style.color = "#ffaa00";
            }
        }
    }

    window.onload = () => {
        loadLivePrice();
        setInterval(loadLivePrice, 5000);
    };
</script>

</body>
</html>
